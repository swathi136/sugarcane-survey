<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <linearGradient id="bg_dq_strong" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#053B1A"/>
        <stop offset="60%" stop-color="#0A1810"/>
        <stop offset="100%" stop-color="#050B08"/>
      </linearGradient>
      <radialGradient id="glow_dq_strong" cx="80%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#22C55E" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#22C55E" stop-opacity="0.0"/>
      </radialGradient>
      <pattern id="grid_dq_strong" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22C55E" stroke-width="0.5" opacity="0.08"/>
      </pattern>
    </defs>

    <!-- Full dark atmospheric card background -->
    <rect width="300" height="200" fill="url(#bg_dq_strong)"/>
    
    <!-- Subtle technical grid texture -->
    <rect width="300" height="200" fill="url(#grid_dq_strong)"/>

    <!-- Ambient glow circle -->
    <rect width="300" height="200" fill="url(#glow_dq_strong)"/>

    <!-- Right side vector artwork -->
    <g transform="translate(60, 0)">
      
        <rect x="90" y="70" width="35" height="90" rx="4" fill="#22C55E" opacity="0.6"/>
        <rect x="160" y="35" width="35" height="125" rx="4" fill="#22C55E"/>
        <path d="M160,20 L195,20 L177.5,5" fill="#22C55E"/>
      
    </g>

    <!-- Subtle framing lines -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#22C55E" stroke-width="2" opacity="0.4"/>
  </svg>