<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <linearGradient id="bg_fert_k" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#382A02"/>
        <stop offset="60%" stop-color="#0A1810"/>
        <stop offset="100%" stop-color="#050B08"/>
      </linearGradient>
      <radialGradient id="glow_fert_k" cx="80%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#EAB308" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#EAB308" stop-opacity="0.0"/>
      </radialGradient>
      <pattern id="grid_fert_k" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#EAB308" stroke-width="0.5" opacity="0.08"/>
      </pattern>
    </defs>

    <!-- Full dark atmospheric card background -->
    <rect width="300" height="200" fill="url(#bg_fert_k)"/>
    
    <!-- Subtle technical grid texture -->
    <rect width="300" height="200" fill="url(#grid_fert_k)"/>

    <!-- Ambient glow circle -->
    <rect width="300" height="200" fill="url(#glow_fert_k)"/>

    <!-- Right side vector artwork -->
    <g transform="translate(60, 0)">
      
        <polygon points="150,35 195,65 195,125 150,155 105,125 105,65" fill="none" stroke="#EAB308" stroke-width="5"/>
        <text x="150" y="112" font-size="34" font-weight="900" fill="#EAB308" text-anchor="middle" font-family="sans-serif">K₂O</text>
      
    </g>

    <!-- Subtle framing lines -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#EAB308" stroke-width="2" opacity="0.4"/>
  </svg>