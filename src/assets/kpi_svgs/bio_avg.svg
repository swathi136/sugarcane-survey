<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <linearGradient id="bg_bio_avg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#043621"/>
        <stop offset="60%" stop-color="#0A1810"/>
        <stop offset="100%" stop-color="#050B08"/>
      </linearGradient>
      <radialGradient id="glow_bio_avg" cx="80%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#10B981" stop-opacity="0.0"/>
      </radialGradient>
      <pattern id="grid_bio_avg" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#10B981" stroke-width="0.5" opacity="0.08"/>
      </pattern>
    </defs>

    <!-- Full dark atmospheric card background -->
    <rect width="300" height="200" fill="url(#bg_bio_avg)"/>
    
    <!-- Subtle technical grid texture -->
    <rect width="300" height="200" fill="url(#grid_bio_avg)"/>

    <!-- Ambient glow circle -->
    <rect width="300" height="200" fill="url(#glow_bio_avg)"/>

    <!-- Right side vector artwork -->
    <g transform="translate(60, 0)">
      
        <path d="M80,40 L180,40 M100,40 L100,160 M140,40 L140,110" stroke="#10B981" stroke-width="6" stroke-linecap="round"/>
        <circle cx="140" cy="110" r="10" fill="#10B981"/>
      
    </g>

    <!-- Subtle framing lines -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#10B981" stroke-width="2" opacity="0.4"/>
  </svg>