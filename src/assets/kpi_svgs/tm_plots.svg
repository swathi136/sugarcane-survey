<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <linearGradient id="bg_tm_plots" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3B1F03"/>
        <stop offset="60%" stop-color="#0A1810"/>
        <stop offset="100%" stop-color="#050B08"/>
      </linearGradient>
      <radialGradient id="glow_tm_plots" cx="80%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#D97706" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#D97706" stop-opacity="0.0"/>
      </radialGradient>
      <pattern id="grid_tm_plots" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#D97706" stroke-width="0.5" opacity="0.08"/>
      </pattern>
    </defs>

    <!-- Full dark atmospheric card background -->
    <rect width="300" height="200" fill="url(#bg_tm_plots)"/>
    
    <!-- Subtle technical grid texture -->
    <rect width="300" height="200" fill="url(#grid_tm_plots)"/>

    <!-- Ambient glow circle -->
    <rect width="300" height="200" fill="url(#glow_tm_plots)"/>

    <!-- Right side vector artwork -->
    <g transform="translate(60, 0)">
      
        <path d="M130,40 L170,40 L170,120 L150,160 L130,120 Z" fill="#D97706" opacity="0.8" stroke="#D97706" stroke-width="3"/>
        <line x1="140" y1="65" x2="160" y2="65" stroke="#FFF" stroke-width="3"/>
        <line x1="140" y1="90" x2="160" y2="90" stroke="#FFF" stroke-width="3"/>
      
    </g>

    <!-- Subtle framing lines -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#D97706" stroke-width="2" opacity="0.4"/>
  </svg>