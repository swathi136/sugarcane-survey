<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <linearGradient id="bg_tc_best" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#392A02"/>
        <stop offset="60%" stop-color="#0A1810"/>
        <stop offset="100%" stop-color="#050B08"/>
      </linearGradient>
      <radialGradient id="glow_tc_best" cx="80%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#EAB308" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#EAB308" stop-opacity="0.0"/>
      </radialGradient>
      <pattern id="grid_tc_best" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#EAB308" stroke-width="0.5" opacity="0.08"/>
      </pattern>
    </defs>

    <!-- Full dark atmospheric card background -->
    <rect width="300" height="200" fill="url(#bg_tc_best)"/>
    
    <!-- Subtle technical grid texture -->
    <rect width="300" height="200" fill="url(#grid_tc_best)"/>

    <!-- Ambient glow circle -->
    <rect width="300" height="200" fill="url(#glow_tc_best)"/>

    <!-- Right side vector artwork -->
    <g transform="translate(60, 0)">
      
        <path d="M120,30 L150,90 L180,30" stroke="#EAB308" stroke-width="6" fill="none"/>
        <circle cx="150" cy="120" r="35" fill="#EAB308"/>
        <polygon points="150,98 157,113 173,115 161,126 164,142 150,134 136,142 139,126 127,115 143,113" fill="#FFF"/>
      
    </g>

    <!-- Subtle framing lines -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#EAB308" stroke-width="2" opacity="0.4"/>
  </svg>