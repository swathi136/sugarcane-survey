<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <linearGradient id="bg_rep_latest" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#092548"/>
        <stop offset="60%" stop-color="#0A1810"/>
        <stop offset="100%" stop-color="#050B08"/>
      </linearGradient>
      <radialGradient id="glow_rep_latest" cx="80%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.0"/>
      </radialGradient>
      <pattern id="grid_rep_latest" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#3B82F6" stroke-width="0.5" opacity="0.08"/>
      </pattern>
    </defs>

    <!-- Full dark atmospheric card background -->
    <rect width="300" height="200" fill="url(#bg_rep_latest)"/>
    
    <!-- Subtle technical grid texture -->
    <rect width="300" height="200" fill="url(#grid_rep_latest)"/>

    <!-- Ambient glow circle -->
    <rect width="300" height="200" fill="url(#glow_rep_latest)"/>

    <!-- Right side vector artwork -->
    <g transform="translate(60, 0)">
      
        <rect x="90" y="45" width="120" height="110" rx="12" stroke="#3B82F6" stroke-width="5" fill="none"/>
        <circle cx="150" cy="100" r="30" stroke="#3B82F6" stroke-width="4" stroke-dasharray="4,3" fill="none"/>
        <text x="150" y="106" font-size="16" font-weight="900" fill="#3B82F6" text-anchor="middle" font-family="sans-serif">2026</text>
      
    </g>

    <!-- Subtle framing lines -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#3B82F6" stroke-width="2" opacity="0.4"/>
  </svg>