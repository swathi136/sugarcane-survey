<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <linearGradient id="bg_tc_tillers" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#29144B"/>
        <stop offset="60%" stop-color="#0A1810"/>
        <stop offset="100%" stop-color="#050B08"/>
      </linearGradient>
      <radialGradient id="glow_tc_tillers" cx="80%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.0"/>
      </radialGradient>
      <pattern id="grid_tc_tillers" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#8B5CF6" stroke-width="0.5" opacity="0.08"/>
      </pattern>
    </defs>

    <!-- Full dark atmospheric card background -->
    <rect width="300" height="200" fill="url(#bg_tc_tillers)"/>
    
    <!-- Subtle technical grid texture -->
    <rect width="300" height="200" fill="url(#grid_tc_tillers)"/>

    <!-- Ambient glow circle -->
    <rect width="300" height="200" fill="url(#glow_tc_tillers)"/>

    <!-- Right side vector artwork -->
    <g transform="translate(60, 0)">
      
        <path d="M150,160 Q120,90 80,60 M150,160 Q140,80 130,40 M150,160 Q160,80 170,40 M150,160 Q180,90 220,60" stroke="#8B5CF6" stroke-width="6" stroke-linecap="round" fill="none"/>
      
    </g>

    <!-- Subtle framing lines -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#8B5CF6" stroke-width="2" opacity="0.4"/>
  </svg>