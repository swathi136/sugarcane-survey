<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <linearGradient id="bg_rep_treatments" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#2A134D"/>
        <stop offset="60%" stop-color="#0A1810"/>
        <stop offset="100%" stop-color="#050B08"/>
      </linearGradient>
      <radialGradient id="glow_rep_treatments" cx="80%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.0"/>
      </radialGradient>
      <pattern id="grid_rep_treatments" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#8B5CF6" stroke-width="0.5" opacity="0.08"/>
      </pattern>
    </defs>

    <!-- Full dark atmospheric card background -->
    <rect width="300" height="200" fill="url(#bg_rep_treatments)"/>
    
    <!-- Subtle technical grid texture -->
    <rect width="300" height="200" fill="url(#grid_rep_treatments)"/>

    <!-- Ambient glow circle -->
    <rect width="300" height="200" fill="url(#glow_rep_treatments)"/>

    <!-- Right side vector artwork -->
    <g transform="translate(60, 0)">
      
        <rect x="90" y="40" width="120" height="130" rx="8" stroke="#8B5CF6" stroke-width="5" fill="none"/>
        <line x1="105" y1="40" x2="105" y2="170" stroke="#8B5CF6" stroke-width="4"/>
        <circle cx="105" cy="65" r="4" fill="#8B5CF6"/>
        <circle cx="105" cy="105" r="4" fill="#8B5CF6"/>
        <circle cx="105" cy="145" r="4" fill="#8B5CF6"/>
      
    </g>

    <!-- Subtle framing lines -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#8B5CF6" stroke-width="2" opacity="0.4"/>
  </svg>