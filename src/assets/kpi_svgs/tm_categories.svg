<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <linearGradient id="bg_tm_categories" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#023826"/>
        <stop offset="60%" stop-color="#0A1810"/>
        <stop offset="100%" stop-color="#050B08"/>
      </linearGradient>
      <radialGradient id="glow_tm_categories" cx="80%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#059669" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#059669" stop-opacity="0.0"/>
      </radialGradient>
      <pattern id="grid_tm_categories" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#059669" stroke-width="0.5" opacity="0.08"/>
      </pattern>
    </defs>

    <!-- Full dark atmospheric card background -->
    <rect width="300" height="200" fill="url(#bg_tm_categories)"/>
    
    <!-- Subtle technical grid texture -->
    <rect width="300" height="200" fill="url(#grid_tm_categories)"/>

    <!-- Ambient glow circle -->
    <rect width="300" height="200" fill="url(#glow_tm_categories)"/>

    <!-- Right side vector artwork -->
    <g transform="translate(60, 0)">
      
        <polygon points="150,40 230,80 150,120 70,80" fill="#059669" opacity="0.8"/>
        <polygon points="150,75 230,115 150,155 70,115" fill="#059669" opacity="0.5"/>
        <polygon points="150,110 230,150 150,190 70,150" fill="#059669" opacity="0.3"/>
      
    </g>

    <!-- Subtle framing lines -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#059669" stroke-width="2" opacity="0.4"/>
  </svg>