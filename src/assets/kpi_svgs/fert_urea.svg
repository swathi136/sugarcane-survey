<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <linearGradient id="bg_fert_urea" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1E293B"/>
        <stop offset="60%" stop-color="#0A1810"/>
        <stop offset="100%" stop-color="#050B08"/>
      </linearGradient>
      <radialGradient id="glow_fert_urea" cx="80%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#64748B" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#64748B" stop-opacity="0.0"/>
      </radialGradient>
      <pattern id="grid_fert_urea" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#64748B" stroke-width="0.5" opacity="0.08"/>
      </pattern>
    </defs>

    <!-- Full dark atmospheric card background -->
    <rect width="300" height="200" fill="url(#bg_fert_urea)"/>
    
    <!-- Subtle technical grid texture -->
    <rect width="300" height="200" fill="url(#grid_fert_urea)"/>

    <!-- Ambient glow circle -->
    <rect width="300" height="200" fill="url(#glow_fert_urea)"/>

    <!-- Right side vector artwork -->
    <g transform="translate(60, 0)">
      
        <path d="M120,40 L180,40 Q190,50 180,60 L200,150 Q200,170 150,170 Q100,170 100,150 L120,60 Q110,50 120,40 Z" fill="#64748B" opacity="0.7" stroke="#64748B" stroke-width="4"/>
        <line x1="120" y1="60" x2="180" y2="60" stroke="#FFF" stroke-width="4"/>
      
    </g>

    <!-- Subtle framing lines -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#64748B" stroke-width="2" opacity="0.4"/>
  </svg>