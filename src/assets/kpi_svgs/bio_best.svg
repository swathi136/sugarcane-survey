<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <linearGradient id="bg_bio_best" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3A2500"/>
        <stop offset="60%" stop-color="#0A1810"/>
        <stop offset="100%" stop-color="#050B08"/>
      </linearGradient>
      <radialGradient id="glow_bio_best" cx="80%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.0"/>
      </radialGradient>
      <pattern id="grid_bio_best" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#F59E0B" stroke-width="0.5" opacity="0.08"/>
      </pattern>
    </defs>

    <!-- Full dark atmospheric card background -->
    <rect width="300" height="200" fill="url(#bg_bio_best)"/>
    
    <!-- Subtle technical grid texture -->
    <rect width="300" height="200" fill="url(#grid_bio_best)"/>

    <!-- Ambient glow circle -->
    <rect width="300" height="200" fill="url(#glow_bio_best)"/>

    <!-- Right side vector artwork -->
    <g transform="translate(60, 0)">
      
        <path d="M100,40 L200,40 L180,110 Q150,140 150,140 Q150,140 120,110 Z" fill="#F59E0B" opacity="0.8"/>
        <path d="M80,50 Q60,50 60,75 Q60,100 90,95 M220,50 Q240,50 240,75 Q240,100 210,95" stroke="#F59E0B" stroke-width="5" fill="none"/>
        <rect x="135" y="140" width="30" height="25" fill="#F59E0B"/>
        <rect x="115" y="165" width="70" height="15" fill="#F59E0B"/>
      
    </g>

    <!-- Subtle framing lines -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#F59E0B" stroke-width="2" opacity="0.4"/>
  </svg>