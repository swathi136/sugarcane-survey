<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <linearGradient id="bg_rep_loc" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#042C44"/>
        <stop offset="60%" stop-color="#0A1810"/>
        <stop offset="100%" stop-color="#050B08"/>
      </linearGradient>
      <radialGradient id="glow_rep_loc" cx="80%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.0"/>
      </radialGradient>
      <pattern id="grid_rep_loc" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0EA5E9" stroke-width="0.5" opacity="0.08"/>
      </pattern>
    </defs>

    <!-- Full dark atmospheric card background -->
    <rect width="300" height="200" fill="url(#bg_rep_loc)"/>
    
    <!-- Subtle technical grid texture -->
    <rect width="300" height="200" fill="url(#grid_rep_loc)"/>

    <!-- Ambient glow circle -->
    <rect width="300" height="200" fill="url(#glow_rep_loc)"/>

    <!-- Right side vector artwork -->
    <g transform="translate(60, 0)">
      
        <rect x="95" y="45" width="110" height="125" rx="8" stroke="#0EA5E9" stroke-width="4" fill="none"/>
        <path d="M150,25 Q165,25 165,42 Q165,58 150,75 Q135,58 135,42 Q135,25 150,25 Z" fill="#0EA5E9"/>
      
    </g>

    <!-- Subtle framing lines -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#0EA5E9" stroke-width="2" opacity="0.4"/>
  </svg>