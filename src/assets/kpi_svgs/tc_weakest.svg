<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <linearGradient id="bg_tc_weakest" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3F0816"/>
        <stop offset="60%" stop-color="#0A1810"/>
        <stop offset="100%" stop-color="#050B08"/>
      </linearGradient>
      <radialGradient id="glow_tc_weakest" cx="80%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.0"/>
      </radialGradient>
      <pattern id="grid_tc_weakest" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#F43F5E" stroke-width="0.5" opacity="0.08"/>
      </pattern>
    </defs>

    <!-- Full dark atmospheric card background -->
    <rect width="300" height="200" fill="url(#bg_tc_weakest)"/>
    
    <!-- Subtle technical grid texture -->
    <rect width="300" height="200" fill="url(#grid_tc_weakest)"/>

    <!-- Ambient glow circle -->
    <rect width="300" height="200" fill="url(#glow_tc_weakest)"/>

    <!-- Right side vector artwork -->
    <g transform="translate(60, 0)">
      
        <path d="M50,140 Q100,120 150,140 Q200,160 250,140" stroke="#F43F5E" stroke-width="6" fill="none"/>
        <polygon points="150,30 200,110 100,110" fill="#F43F5E" opacity="0.8"/>
        <text x="150" y="95" font-size="36" font-weight="900" fill="#FFF" text-anchor="middle" font-family="sans-serif">!</text>
      
    </g>

    <!-- Subtle framing lines -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#F43F5E" stroke-width="2" opacity="0.4"/>
  </svg>