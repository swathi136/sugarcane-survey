<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <linearGradient id="bg_fert_n" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#04343D"/>
        <stop offset="60%" stop-color="#0A1810"/>
        <stop offset="100%" stop-color="#050B08"/>
      </linearGradient>
      <radialGradient id="glow_fert_n" cx="80%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.0"/>
      </radialGradient>
      <pattern id="grid_fert_n" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#06B6D4" stroke-width="0.5" opacity="0.08"/>
      </pattern>
    </defs>

    <!-- Full dark atmospheric card background -->
    <rect width="300" height="200" fill="url(#bg_fert_n)"/>
    
    <!-- Subtle technical grid texture -->
    <rect width="300" height="200" fill="url(#grid_fert_n)"/>

    <!-- Ambient glow circle -->
    <rect width="300" height="200" fill="url(#glow_fert_n)"/>

    <!-- Right side vector artwork -->
    <g transform="translate(60, 0)">
      
        <circle cx="150" cy="100" r="45" fill="none" stroke="#06B6D4" stroke-width="5"/>
        <text x="150" y="115" font-size="44" font-weight="900" fill="#06B6D4" text-anchor="middle" font-family="sans-serif">N</text>
        <circle cx="95" cy="60" r="8" fill="#06B6D4" opacity="0.6"/>
        <circle cx="205" cy="140" r="12" fill="#06B6D4" opacity="0.8"/>
      
    </g>

    <!-- Subtle framing lines -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#06B6D4" stroke-width="2" opacity="0.4"/>
  </svg>