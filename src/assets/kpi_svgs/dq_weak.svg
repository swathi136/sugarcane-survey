<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <linearGradient id="bg_dq_weak" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3C2303"/>
        <stop offset="60%" stop-color="#0A1810"/>
        <stop offset="100%" stop-color="#050B08"/>
      </linearGradient>
      <radialGradient id="glow_dq_weak" cx="80%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.0"/>
      </radialGradient>
      <pattern id="grid_dq_weak" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#F59E0B" stroke-width="0.5" opacity="0.08"/>
      </pattern>
    </defs>

    <!-- Full dark atmospheric card background -->
    <rect width="300" height="200" fill="url(#bg_dq_weak)"/>
    
    <!-- Subtle technical grid texture -->
    <rect width="300" height="200" fill="url(#grid_dq_weak)"/>

    <!-- Ambient glow circle -->
    <rect width="300" height="200" fill="url(#glow_dq_weak)"/>

    <!-- Right side vector artwork -->
    <g transform="translate(60, 0)">
      
        <rect x="95" y="40" width="110" height="130" rx="8" stroke="#F59E0B" stroke-width="4" fill="none"/>
        <line x1="120" y1="70" x2="180" y2="70" stroke="#F59E0B" stroke-width="4"/>
        <line x1="120" y1="95" x2="160" y2="95" stroke="#F59E0B" stroke-width="4"/>
        <circle cx="170" cy="140" r="14" fill="#F59E0B"/>
        <text x="170" y="146" font-size="16" font-weight="900" fill="#FFF" text-anchor="middle" font-family="sans-serif">!</text>
      
    </g>

    <!-- Subtle framing lines -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#F59E0B" stroke-width="2" opacity="0.4"/>
  </svg>