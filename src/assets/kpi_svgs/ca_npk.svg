<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <linearGradient id="bg_ca_npk" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3B2302"/>
        <stop offset="60%" stop-color="#0A1810"/>
        <stop offset="100%" stop-color="#050B08"/>
      </linearGradient>
      <radialGradient id="glow_ca_npk" cx="80%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.0"/>
      </radialGradient>
      <pattern id="grid_ca_npk" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#F59E0B" stroke-width="0.5" opacity="0.08"/>
      </pattern>
    </defs>

    <!-- Full dark atmospheric card background -->
    <rect width="300" height="200" fill="url(#bg_ca_npk)"/>
    
    <!-- Subtle technical grid texture -->
    <rect width="300" height="200" fill="url(#grid_ca_npk)"/>

    <!-- Ambient glow circle -->
    <rect width="300" height="200" fill="url(#glow_ca_npk)"/>

    <!-- Right side vector artwork -->
    <g transform="translate(60, 0)">
      
        <circle cx="120" cy="85" r="28" fill="#F59E0B" opacity="0.9"/>
        <circle cx="180" cy="85" r="28" fill="#F59E0B" opacity="0.7"/>
        <circle cx="150" cy="135" r="28" fill="#F59E0B" opacity="0.5"/>
        <text x="120" y="93" font-size="20" font-weight="800" fill="#FFF" text-anchor="middle" font-family="sans-serif">N</text>
        <text x="180" y="93" font-size="20" font-weight="800" fill="#FFF" text-anchor="middle" font-family="sans-serif">P</text>
        <text x="150" y="143" font-size="20" font-weight="800" fill="#FFF" text-anchor="middle" font-family="sans-serif">K</text>
      
    </g>

    <!-- Subtle framing lines -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#F59E0B" stroke-width="2" opacity="0.4"/>
  </svg>