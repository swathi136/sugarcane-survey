<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <linearGradient id="bg_fert_plots" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#073618"/>
        <stop offset="60%" stop-color="#0A1810"/>
        <stop offset="100%" stop-color="#050B08"/>
      </linearGradient>
      <radialGradient id="glow_fert_plots" cx="80%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#16A34A" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#16A34A" stop-opacity="0.0"/>
      </radialGradient>
      <pattern id="grid_fert_plots" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#16A34A" stroke-width="0.5" opacity="0.08"/>
      </pattern>
    </defs>

    <!-- Full dark atmospheric card background -->
    <rect width="300" height="200" fill="url(#bg_fert_plots)"/>
    
    <!-- Subtle technical grid texture -->
    <rect width="300" height="200" fill="url(#grid_fert_plots)"/>

    <!-- Ambient glow circle -->
    <rect width="300" height="200" fill="url(#glow_fert_plots)"/>

    <!-- Right side vector artwork -->
    <g transform="translate(60, 0)">
      
        <rect x="70" y="40" width="160" height="120" rx="8" fill="none" stroke="#16A34A" stroke-width="4"/>
        <line x1="123" y1="40" x2="123" y2="160" stroke="#16A34A" stroke-width="3"/>
        <line x1="176" y1="40" x2="176" y2="160" stroke="#16A34A" stroke-width="3"/>
        <line x1="70" y1="80" x2="230" y2="80" stroke="#16A34A" stroke-width="3"/>
        <line x1="70" y1="120" x2="230" y2="120" stroke="#16A34A" stroke-width="3"/>
        <circle cx="96" cy="60" r="8" fill="#16A34A"/>
        <circle cx="150" cy="100" r="8" fill="#16A34A"/>
        <circle cx="203" cy="140" r="8" fill="#16A34A"/>
      
    </g>

    <!-- Subtle framing lines -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#16A34A" stroke-width="2" opacity="0.4"/>
  </svg>