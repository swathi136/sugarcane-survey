<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <linearGradient id="bg_fert_schedule" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#052A3D"/>
        <stop offset="60%" stop-color="#0A1810"/>
        <stop offset="100%" stop-color="#050B08"/>
      </linearGradient>
      <radialGradient id="glow_fert_schedule" cx="80%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#0284C7" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#0284C7" stop-opacity="0.0"/>
      </radialGradient>
      <pattern id="grid_fert_schedule" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0284C7" stroke-width="0.5" opacity="0.08"/>
      </pattern>
    </defs>

    <!-- Full dark atmospheric card background -->
    <rect width="300" height="200" fill="url(#bg_fert_schedule)"/>
    
    <!-- Subtle technical grid texture -->
    <rect width="300" height="200" fill="url(#grid_fert_schedule)"/>

    <!-- Ambient glow circle -->
    <rect width="300" height="200" fill="url(#glow_fert_schedule)"/>

    <!-- Right side vector artwork -->
    <g transform="translate(60, 0)">
      
        <path d="M40,100 L260,100" stroke="#0284C7" stroke-width="8" stroke-linecap="round"/>
        <path d="M100,100 Q100,140 110,155 Q110,170 100,170 Q90,170 90,155 Z" fill="#0284C7"/>
        <path d="M200,100 Q200,140 210,155 Q210,170 200,170 Q190,170 190,155 Z" fill="#0284C7"/>
      
    </g>

    <!-- Subtle framing lines -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#0284C7" stroke-width="2" opacity="0.4"/>
  </svg>