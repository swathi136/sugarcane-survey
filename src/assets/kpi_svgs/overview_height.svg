<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <linearGradient id="bg_overview_height" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3C2404"/>
        <stop offset="60%" stop-color="#0A1810"/>
        <stop offset="100%" stop-color="#050B08"/>
      </linearGradient>
      <radialGradient id="glow_overview_height" cx="80%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.0"/>
      </radialGradient>
      <pattern id="grid_overview_height" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#F59E0B" stroke-width="0.5" opacity="0.08"/>
      </pattern>
    </defs>

    <!-- Full dark atmospheric card background -->
    <rect width="300" height="200" fill="url(#bg_overview_height)"/>
    
    <!-- Subtle technical grid texture -->
    <rect width="300" height="200" fill="url(#grid_overview_height)"/>

    <!-- Ambient glow circle -->
    <rect width="300" height="200" fill="url(#glow_overview_height)"/>

    <!-- Right side vector artwork -->
    <g transform="translate(60, 0)">
      
        <rect x="140" y="20" width="50" height="150" rx="8" fill="none" stroke="#F59E0B" stroke-width="4"/>
        <line x1="140" y1="40" x2="165" y2="40" stroke="#F59E0B" stroke-width="4"/>
        <line x1="140" y1="65" x2="180" y2="65" stroke="#F59E0B" stroke-width="4"/>
        <line x1="140" y1="90" x2="165" y2="90" stroke="#F59E0B" stroke-width="4"/>
        <line x1="140" y1="115" x2="180" y2="115" stroke="#F59E0B" stroke-width="4"/>
        <line x1="140" y1="140" x2="165" y2="140" stroke="#F59E0B" stroke-width="4"/>
      
    </g>

    <!-- Subtle framing lines -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#F59E0B" stroke-width="2" opacity="0.4"/>
  </svg>