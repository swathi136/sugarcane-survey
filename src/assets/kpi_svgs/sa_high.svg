<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <linearGradient id="bg_sa_high" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#450A0A"/>
        <stop offset="60%" stop-color="#0A1810"/>
        <stop offset="100%" stop-color="#050B08"/>
      </linearGradient>
      <radialGradient id="glow_sa_high" cx="80%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#DC2626" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#DC2626" stop-opacity="0.0"/>
      </radialGradient>
      <pattern id="grid_sa_high" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#DC2626" stroke-width="0.5" opacity="0.08"/>
      </pattern>
    </defs>

    <!-- Full dark atmospheric card background -->
    <rect width="300" height="200" fill="url(#bg_sa_high)"/>
    
    <!-- Subtle technical grid texture -->
    <rect width="300" height="200" fill="url(#grid_sa_high)"/>

    <!-- Ambient glow circle -->
    <rect width="300" height="200" fill="url(#glow_sa_high)"/>

    <!-- Right side vector artwork -->
    <g transform="translate(60, 0)">
      
        <path d="M150,35 L210,65 L210,115 Q150,165 150,165 Q150,165 90,115 L90,65 Z" fill="#DC2626" stroke="#FFF" stroke-width="3"/>
        <line x1="150" y1="70" x2="150" y2="110" stroke="#FFF" stroke-width="5" stroke-linecap="round"/>
        <circle cx="150" cy="130" r="4" fill="#FFF"/>
      
    </g>

    <!-- Subtle framing lines -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#DC2626" stroke-width="2" opacity="0.4"/>
  </svg>