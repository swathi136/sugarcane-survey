<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <linearGradient id="bg_tm_locations" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#07334F"/>
        <stop offset="60%" stop-color="#0A1810"/>
        <stop offset="100%" stop-color="#050B08"/>
      </linearGradient>
      <radialGradient id="glow_tm_locations" cx="80%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0"/>
      </radialGradient>
      <pattern id="grid_tm_locations" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#38BDF8" stroke-width="0.5" opacity="0.08"/>
      </pattern>
    </defs>

    <!-- Full dark atmospheric card background -->
    <rect width="300" height="200" fill="url(#bg_tm_locations)"/>
    
    <!-- Subtle technical grid texture -->
    <rect width="300" height="200" fill="url(#grid_tm_locations)"/>

    <!-- Ambient glow circle -->
    <rect width="300" height="200" fill="url(#glow_tm_locations)"/>

    <!-- Right side vector artwork -->
    <g transform="translate(60, 0)">
      
        <circle cx="160" cy="90" r="45" fill="none" stroke="#38BDF8" stroke-width="4" stroke-dasharray="6,6"/>
        <circle cx="160" cy="90" r="20" fill="none" stroke="#38BDF8" stroke-width="5"/>
        <path d="M160,35 L160,145 M105,90 L215,90" stroke="#38BDF8" stroke-width="3" opacity="0.6"/>
        <circle cx="160" cy="90" r="8" fill="#38BDF8"/>
      
    </g>

    <!-- Subtle framing lines -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#38BDF8" stroke-width="2" opacity="0.4"/>
  </svg>