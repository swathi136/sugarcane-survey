<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <linearGradient id="bg_dq_fertigation" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#04343D"/>
        <stop offset="60%" stop-color="#0A1810"/>
        <stop offset="100%" stop-color="#050B08"/>
      </linearGradient>
      <radialGradient id="glow_dq_fertigation" cx="80%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.0"/>
      </radialGradient>
      <pattern id="grid_dq_fertigation" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#06B6D4" stroke-width="0.5" opacity="0.08"/>
      </pattern>
    </defs>

    <!-- Full dark atmospheric card background -->
    <rect width="300" height="200" fill="url(#bg_dq_fertigation)"/>
    
    <!-- Subtle technical grid texture -->
    <rect width="300" height="200" fill="url(#grid_dq_fertigation)"/>

    <!-- Ambient glow circle -->
    <rect width="300" height="200" fill="url(#glow_dq_fertigation)"/>

    <!-- Right side vector artwork -->
    <g transform="translate(60, 0)">
      
        <path d="M90,140 A55,55 0 1,1 210,140" fill="none" stroke="#06B6D4" stroke-width="8"/>
        <line x1="150" y1="140" x2="190" y2="85" stroke="#06B6D4" stroke-width="5" stroke-linecap="round"/>
        <circle cx="150" cy="140" r="8" fill="#06B6D4"/>
      
    </g>

    <!-- Subtle framing lines -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#06B6D4" stroke-width="2" opacity="0.4"/>
  </svg>