<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <linearGradient id="bg_tc_count" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0A2540"/>
        <stop offset="60%" stop-color="#0A1810"/>
        <stop offset="100%" stop-color="#050B08"/>
      </linearGradient>
      <radialGradient id="glow_tc_count" cx="80%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.0"/>
      </radialGradient>
      <pattern id="grid_tc_count" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#3B82F6" stroke-width="0.5" opacity="0.08"/>
      </pattern>
    </defs>

    <!-- Full dark atmospheric card background -->
    <rect width="300" height="200" fill="url(#bg_tc_count)"/>
    
    <!-- Subtle technical grid texture -->
    <rect width="300" height="200" fill="url(#grid_tc_count)"/>

    <!-- Ambient glow circle -->
    <rect width="300" height="200" fill="url(#glow_tc_count)"/>

    <!-- Right side vector artwork -->
    <g transform="translate(60, 0)">
      
        <rect x="80" y="50" width="55" height="100" rx="6" stroke="#3B82F6" stroke-width="4" fill="none"/>
        <rect x="165" y="50" width="55" height="100" rx="6" stroke="#3B82F6" stroke-width="4" fill="none"/>
        <path d="M140,90 L160,100 L140,110" stroke="#3B82F6" stroke-width="4" fill="none"/>
      
    </g>

    <!-- Subtle framing lines -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#3B82F6" stroke-width="2" opacity="0.4"/>
  </svg>