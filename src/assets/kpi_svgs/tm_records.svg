<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <linearGradient id="bg_tm_records" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0C2340"/>
        <stop offset="60%" stop-color="#0A1810"/>
        <stop offset="100%" stop-color="#050B08"/>
      </linearGradient>
      <radialGradient id="glow_tm_records" cx="80%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#2563EB" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#2563EB" stop-opacity="0.0"/>
      </radialGradient>
      <pattern id="grid_tm_records" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2563EB" stroke-width="0.5" opacity="0.08"/>
      </pattern>
    </defs>

    <!-- Full dark atmospheric card background -->
    <rect width="300" height="200" fill="url(#bg_tm_records)"/>
    
    <!-- Subtle technical grid texture -->
    <rect width="300" height="200" fill="url(#grid_tm_records)"/>

    <!-- Ambient glow circle -->
    <rect width="300" height="200" fill="url(#glow_tm_records)"/>

    <!-- Right side vector artwork -->
    <g transform="translate(60, 0)">
      
        <rect x="80" y="40" width="140" height="110" rx="8" fill="none" stroke="#2563EB" stroke-width="5"/>
        <line x1="80" y1="75" x2="220" y2="75" stroke="#2563EB" stroke-width="4"/>
        <line x1="80" y1="110" x2="220" y2="110" stroke="#2563EB" stroke-width="3" opacity="0.6"/>
        <line x1="130" y1="40" x2="130" y2="150" stroke="#2563EB" stroke-width="4"/>
        <line x1="175" y1="40" x2="175" y2="150" stroke="#2563EB" stroke-width="3" opacity="0.6"/>
      
    </g>

    <!-- Subtle framing lines -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#2563EB" stroke-width="2" opacity="0.4"/>
  </svg>