<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <linearGradient id="bg_sa_medium" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#431903"/>
        <stop offset="60%" stop-color="#0A1810"/>
        <stop offset="100%" stop-color="#050B08"/>
      </linearGradient>
      <radialGradient id="glow_sa_medium" cx="80%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#F97316" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#F97316" stop-opacity="0.0"/>
      </radialGradient>
      <pattern id="grid_sa_medium" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#F97316" stroke-width="0.5" opacity="0.08"/>
      </pattern>
    </defs>

    <!-- Full dark atmospheric card background -->
    <rect width="300" height="200" fill="url(#bg_sa_medium)"/>
    
    <!-- Subtle technical grid texture -->
    <rect width="300" height="200" fill="url(#grid_sa_medium)"/>

    <!-- Ambient glow circle -->
    <rect width="300" height="200" fill="url(#glow_sa_medium)"/>

    <!-- Right side vector artwork -->
    <g transform="translate(60, 0)">
      
        <polygon points="150,35 225,155 75,155" fill="#F97316"/>
        <line x1="150" y1="75" x2="150" y2="120" stroke="#FFF" stroke-width="5" stroke-linecap="round"/>
        <circle cx="150" cy="138" r="4" fill="#FFF"/>
      
    </g>

    <!-- Subtle framing lines -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#F97316" stroke-width="2" opacity="0.4"/>
  </svg>