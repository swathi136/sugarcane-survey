<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <linearGradient id="bg_sa_total" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3D0A0A"/>
        <stop offset="60%" stop-color="#0A1810"/>
        <stop offset="100%" stop-color="#050B08"/>
      </linearGradient>
      <radialGradient id="glow_sa_total" cx="80%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#EF4444" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#EF4444" stop-opacity="0.0"/>
      </radialGradient>
      <pattern id="grid_sa_total" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#EF4444" stroke-width="0.5" opacity="0.08"/>
      </pattern>
    </defs>

    <!-- Full dark atmospheric card background -->
    <rect width="300" height="200" fill="url(#bg_sa_total)"/>
    
    <!-- Subtle technical grid texture -->
    <rect width="300" height="200" fill="url(#grid_sa_total)"/>

    <!-- Ambient glow circle -->
    <rect width="300" height="200" fill="url(#glow_sa_total)"/>

    <!-- Right side vector artwork -->
    <g transform="translate(60, 0)">
      
        <path d="M150,40 Q180,40 180,90 L195,120 L105,120 L120,90 Q120,40 150,40 Z" fill="#EF4444"/>
        <path d="M135,130 Q150,150 165,130 Z" stroke="#EF4444" stroke-width="4" fill="none"/>
        <circle cx="215" cy="50" r="14" fill="#FF0000"/>
      
    </g>

    <!-- Subtle framing lines -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#EF4444" stroke-width="2" opacity="0.4"/>
  </svg>