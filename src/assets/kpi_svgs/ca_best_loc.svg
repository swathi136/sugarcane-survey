<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <linearGradient id="bg_ca_best_loc" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#042C44"/>
        <stop offset="60%" stop-color="#0A1810"/>
        <stop offset="100%" stop-color="#050B08"/>
      </linearGradient>
      <radialGradient id="glow_ca_best_loc" cx="80%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.0"/>
      </radialGradient>
      <pattern id="grid_ca_best_loc" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0EA5E9" stroke-width="0.5" opacity="0.08"/>
      </pattern>
    </defs>

    <!-- Full dark atmospheric card background -->
    <rect width="300" height="200" fill="url(#bg_ca_best_loc)"/>
    
    <!-- Subtle technical grid texture -->
    <rect width="300" height="200" fill="url(#grid_ca_best_loc)"/>

    <!-- Ambient glow circle -->
    <rect width="300" height="200" fill="url(#glow_ca_best_loc)"/>

    <!-- Right side vector artwork -->
    <g transform="translate(60, 0)">
      
        <path d="M40,150 Q100,90 160,130 Q220,70 280,150 Z" fill="#0EA5E9" opacity="0.5"/>
        <path d="M80,160 Q160,110 240,160 Z" fill="#0EA5E9" opacity="0.8"/>
        <circle cx="230" cy="60" r="20" fill="#0EA5E9" opacity="0.9"/>
      
    </g>

    <!-- Subtle framing lines -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#0EA5E9" stroke-width="2" opacity="0.4"/>
  </svg>