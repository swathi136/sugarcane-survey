<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <!-- Rich 2026 dark atmospheric background gradient -->
      <linearGradient id="bg_tm_treatments" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#260F38"/>
        <stop offset="65%" stop-color="#4A1D6B"/>
        <stop offset="100%" stop-color="#050806"/>
      </linearGradient>

      <!-- Ambient radial lighting vignette -->
      <radialGradient id="glow_tm_treatments" cx="75%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#C084FC" stop-opacity="0.45"/>
        <stop offset="50%" stop-color="#C084FC" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#C084FC" stop-opacity="0.0"/>
      </radialGradient>

      <!-- Precision tech grid overlay -->
      <pattern id="grid_tm_treatments" width="16" height="16" patternUnits="userSpaceOnUse">
        <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#C084FC" stroke-width="0.5" opacity="0.09"/>
      </pattern>
    </defs>

    <!-- Base Canvas -->
    <rect width="300" height="200" fill="url(#bg_tm_treatments)"/>
    <rect width="300" height="200" fill="url(#grid_tm_treatments)"/>
    <rect width="300" height="200" fill="url(#glow_tm_treatments)"/>

    <!-- Tailored Vector Scene Artwork -->
    
          <g transform="translate(215, 90)">
            <path d="M-15,-40 L15,-40 M-8,-40 L-8,-15 L-35,35 Q-42,48 -25,52 L25,52 Q42,48 35,35 L8,-15 L8,-40" stroke="#C084FC" stroke-width="4" fill="none"/>
            <path d="M-30,30 Q0,20 30,30 L25,50 L-25,50 Z" fill="#C084FC" opacity="0.8"/>
            <circle cx="-10" cy="10" r="5" fill="#C084FC"/>
            <circle cx="10" cy="-5" r="4" fill="#C084FC"/>
          </g>
        
          <circle cx="210" cy="95" r="35" fill="#C084FC" opacity="0.7"/>
        
          <circle cx="210" cy="95" r="35" fill="#C084FC" opacity="0.7"/>
        

    <!-- Top Glow Rim Accent Line -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#C084FC" stroke-width="2.5" opacity="0.8"/>
  </svg>