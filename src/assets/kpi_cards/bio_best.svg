<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <!-- Rich 2026 dark atmospheric background gradient -->
      <linearGradient id="bg_bio_best" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#362203"/>
        <stop offset="65%" stop-color="#63410A"/>
        <stop offset="100%" stop-color="#050806"/>
      </linearGradient>

      <!-- Ambient radial lighting vignette -->
      <radialGradient id="glow_bio_best" cx="75%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#EAB308" stop-opacity="0.45"/>
        <stop offset="50%" stop-color="#EAB308" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#EAB308" stop-opacity="0.0"/>
      </radialGradient>

      <!-- Precision tech grid overlay -->
      <pattern id="grid_bio_best" width="16" height="16" patternUnits="userSpaceOnUse">
        <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#EAB308" stroke-width="0.5" opacity="0.09"/>
      </pattern>
    </defs>

    <!-- Base Canvas -->
    <rect width="300" height="200" fill="url(#bg_bio_best)"/>
    <rect width="300" height="200" fill="url(#grid_bio_best)"/>
    <rect width="300" height="200" fill="url(#glow_bio_best)"/>

    <!-- Tailored Vector Scene Artwork -->
    
          <g transform="translate(215, 90)">
            <path d="M-30,-40 L30,-40 L22,15 Q0,40 0,40 Q0,40 -22,15 Z" fill="#EAB308" opacity="0.9"/>
            <path d="M-30,-30 Q-45,-30 -45,-10 Q-45,10 -20,8 M30,-30 Q45,-30 45,-10 Q45,10 20,8" stroke="#EAB308" stroke-width="4" fill="none"/>
            <rect x="-12" y="40" width="24" height="20" fill="#EAB308"/>
            <rect x="-25" y="60" width="50" height="10" fill="#EAB308"/>
          </g>
        
          <circle cx="210" cy="95" r="35" fill="#EAB308" opacity="0.7"/>
        
          <circle cx="210" cy="95" r="35" fill="#EAB308" opacity="0.7"/>
        

    <!-- Top Glow Rim Accent Line -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#EAB308" stroke-width="2.5" opacity="0.8"/>
  </svg>