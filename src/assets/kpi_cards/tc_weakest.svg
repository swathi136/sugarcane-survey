<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <!-- Rich 2026 dark atmospheric background gradient -->
      <linearGradient id="bg_tc_weakest" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3B0813"/>
        <stop offset="65%" stop-color="#691225"/>
        <stop offset="100%" stop-color="#050806"/>
      </linearGradient>

      <!-- Ambient radial lighting vignette -->
      <radialGradient id="glow_tc_weakest" cx="75%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.45"/>
        <stop offset="50%" stop-color="#F43F5E" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.0"/>
      </radialGradient>

      <!-- Precision tech grid overlay -->
      <pattern id="grid_tc_weakest" width="16" height="16" patternUnits="userSpaceOnUse">
        <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#F43F5E" stroke-width="0.5" opacity="0.09"/>
      </pattern>
    </defs>

    <!-- Base Canvas -->
    <rect width="300" height="200" fill="url(#bg_tc_weakest)"/>
    <rect width="300" height="200" fill="url(#grid_tc_weakest)"/>
    <rect width="300" height="200" fill="url(#glow_tc_weakest)"/>

    <!-- Tailored Vector Scene Artwork -->
    
          <circle cx="210" cy="95" r="35" fill="#F43F5E" opacity="0.7"/>
        
          <circle cx="210" cy="95" r="35" fill="#F43F5E" opacity="0.7"/>
        

    <!-- Top Glow Rim Accent Line -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#F43F5E" stroke-width="2.5" opacity="0.8"/>
  </svg>