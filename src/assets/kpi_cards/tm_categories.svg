<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <!-- Rich 2026 dark atmospheric background gradient -->
      <linearGradient id="bg_tm_categories" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#03261A"/>
        <stop offset="65%" stop-color="#084C35"/>
        <stop offset="100%" stop-color="#050806"/>
      </linearGradient>

      <!-- Ambient radial lighting vignette -->
      <radialGradient id="glow_tm_categories" cx="75%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#059669" stop-opacity="0.45"/>
        <stop offset="50%" stop-color="#059669" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#059669" stop-opacity="0.0"/>
      </radialGradient>

      <!-- Precision tech grid overlay -->
      <pattern id="grid_tm_categories" width="16" height="16" patternUnits="userSpaceOnUse">
        <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#059669" stroke-width="0.5" opacity="0.09"/>
      </pattern>
    </defs>

    <!-- Base Canvas -->
    <rect width="300" height="200" fill="url(#bg_tm_categories)"/>
    <rect width="300" height="200" fill="url(#grid_tm_categories)"/>
    <rect width="300" height="200" fill="url(#glow_tm_categories)"/>

    <!-- Tailored Vector Scene Artwork -->
    
          <path d="M120,60 Q200,40 300,70" stroke="#059669" stroke-width="3" opacity="0.4" fill="none"/>
          <path d="M100,100 Q190,80 300,110" stroke="#059669" stroke-width="4" opacity="0.6" fill="none"/>
          <path d="M80,140 Q180,130 300,150" stroke="#059669" stroke-width="3" opacity="0.8" fill="none"/>
        
          <circle cx="210" cy="95" r="35" fill="#059669" opacity="0.7"/>
        
          <circle cx="210" cy="95" r="35" fill="#059669" opacity="0.7"/>
        

    <!-- Top Glow Rim Accent Line -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#059669" stroke-width="2.5" opacity="0.8"/>
  </svg>