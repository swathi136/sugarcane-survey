<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <!-- Rich 2026 dark atmospheric background gradient -->
      <linearGradient id="bg_sa_total" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3B0909"/>
        <stop offset="65%" stop-color="#691212"/>
        <stop offset="100%" stop-color="#050806"/>
      </linearGradient>

      <!-- Ambient radial lighting vignette -->
      <radialGradient id="glow_sa_total" cx="75%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#EF4444" stop-opacity="0.45"/>
        <stop offset="50%" stop-color="#EF4444" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#EF4444" stop-opacity="0.0"/>
      </radialGradient>

      <!-- Precision tech grid overlay -->
      <pattern id="grid_sa_total" width="16" height="16" patternUnits="userSpaceOnUse">
        <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#EF4444" stroke-width="0.5" opacity="0.09"/>
      </pattern>
    </defs>

    <!-- Base Canvas -->
    <rect width="300" height="200" fill="url(#bg_sa_total)"/>
    <rect width="300" height="200" fill="url(#grid_sa_total)"/>
    <rect width="300" height="200" fill="url(#glow_sa_total)"/>

    <!-- Tailored Vector Scene Artwork -->
    
          <g transform="translate(210, 95)">
            <path d="M0,-35 Q22,-35 22,10 L32,30 L-32,30 L-22,10 Q-22,-35 0,-35 Z" fill="#EF4444"/>
            <path d="M-12,38 Q0,52 12,38 Z" stroke="#EF4444" stroke-width="4" fill="none"/>
            <circle cx="30" cy="-25" r="12" fill="#FF0000"/>
          </g>
        
          <circle cx="210" cy="95" r="35" fill="#EF4444" opacity="0.7"/>
        

    <!-- Top Glow Rim Accent Line -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#EF4444" stroke-width="2.5" opacity="0.8"/>
  </svg>