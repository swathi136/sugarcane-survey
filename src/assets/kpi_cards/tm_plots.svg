<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <!-- Rich 2026 dark atmospheric background gradient -->
      <linearGradient id="bg_tm_plots" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#2E1904"/>
        <stop offset="65%" stop-color="#57300B"/>
        <stop offset="100%" stop-color="#050806"/>
      </linearGradient>

      <!-- Ambient radial lighting vignette -->
      <radialGradient id="glow_tm_plots" cx="75%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#D97706" stop-opacity="0.45"/>
        <stop offset="50%" stop-color="#D97706" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#D97706" stop-opacity="0.0"/>
      </radialGradient>

      <!-- Precision tech grid overlay -->
      <pattern id="grid_tm_plots" width="16" height="16" patternUnits="userSpaceOnUse">
        <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#D97706" stroke-width="0.5" opacity="0.09"/>
      </pattern>
    </defs>

    <!-- Base Canvas -->
    <rect width="300" height="200" fill="url(#bg_tm_plots)"/>
    <rect width="300" height="200" fill="url(#grid_tm_plots)"/>
    <rect width="300" height="200" fill="url(#glow_tm_plots)"/>

    <!-- Tailored Vector Scene Artwork -->
    
          <g transform="translate(220, 85)">
            <path d="M-20,-45 L20,-45 L20,35 L0,65 L-20,35 Z" fill="#D97706" opacity="0.85" stroke="#FFF" stroke-width="2"/>
            <line x1="-12" y1="-25" x2="12" y2="-25" stroke="#FFF" stroke-width="3"/>
            <line x1="-12" y1="-5" x2="12" y2="-5" stroke="#FFF" stroke-width="3"/>
          </g>
        
          <circle cx="210" cy="95" r="35" fill="#D97706" opacity="0.7"/>
        
          <circle cx="210" cy="95" r="35" fill="#D97706" opacity="0.7"/>
        

    <!-- Top Glow Rim Accent Line -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#D97706" stroke-width="2.5" opacity="0.8"/>
  </svg>