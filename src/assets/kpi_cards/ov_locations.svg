<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <!-- Rich 2026 dark atmospheric background gradient -->
      <linearGradient id="bg_ov_locations" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0B2545"/>
        <stop offset="65%" stop-color="#134074"/>
        <stop offset="100%" stop-color="#050806"/>
      </linearGradient>

      <!-- Ambient radial lighting vignette -->
      <radialGradient id="glow_ov_locations" cx="75%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
        <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0"/>
      </radialGradient>

      <!-- Precision tech grid overlay -->
      <pattern id="grid_ov_locations" width="16" height="16" patternUnits="userSpaceOnUse">
        <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#38BDF8" stroke-width="0.5" opacity="0.09"/>
      </pattern>
    </defs>

    <!-- Base Canvas -->
    <rect width="300" height="200" fill="url(#bg_ov_locations)"/>
    <rect width="300" height="200" fill="url(#grid_ov_locations)"/>
    <rect width="300" height="200" fill="url(#glow_ov_locations)"/>

    <!-- Tailored Vector Scene Artwork -->
    
          <circle cx="210" cy="95" r="35" fill="#38BDF8" opacity="0.7"/>
        
          <g transform="translate(220, 70)">
            <circle r="22" fill="#38BDF8" opacity="0.3"/>
            <circle r="12" fill="#38BDF8" opacity="0.9"/>
            <path d="M0,0 L0,22" stroke="#38BDF8" stroke-width="3"/>
            <circle r="4" fill="#FFF"/>
          </g>
        
          <g transform="translate(260, 140)">
            
            <circle r="12" fill="#38BDF8" opacity="0.9"/>
            <path d="M0,0 L0,22" stroke="#38BDF8" stroke-width="3"/>
            <circle r="4" fill="#FFF"/>
          </g>
        
          <g transform="translate(170, 130)">
            
            <circle r="12" fill="#38BDF8" opacity="0.9"/>
            <path d="M0,0 L0,22" stroke="#38BDF8" stroke-width="3"/>
            <circle r="4" fill="#FFF"/>
          </g>
        
          <circle cx="210" cy="95" r="35" fill="#38BDF8" opacity="0.7"/>
        

    <!-- Top Glow Rim Accent Line -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#38BDF8" stroke-width="2.5" opacity="0.8"/>
  </svg>