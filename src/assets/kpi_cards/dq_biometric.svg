<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <!-- Rich 2026 dark atmospheric background gradient -->
      <linearGradient id="bg_dq_biometric" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#081F3B"/>
        <stop offset="65%" stop-color="#113C70"/>
        <stop offset="100%" stop-color="#050806"/>
      </linearGradient>

      <!-- Ambient radial lighting vignette -->
      <radialGradient id="glow_dq_biometric" cx="75%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.45"/>
        <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.0"/>
      </radialGradient>

      <!-- Precision tech grid overlay -->
      <pattern id="grid_dq_biometric" width="16" height="16" patternUnits="userSpaceOnUse">
        <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#3B82F6" stroke-width="0.5" opacity="0.09"/>
      </pattern>
    </defs>

    <!-- Base Canvas -->
    <rect width="300" height="200" fill="url(#bg_dq_biometric)"/>
    <rect width="300" height="200" fill="url(#grid_dq_biometric)"/>
    <rect width="300" height="200" fill="url(#glow_dq_biometric)"/>

    <!-- Tailored Vector Scene Artwork -->
    
          <g transform="translate(210, 95)">
            <ellipse cy="-30" rx="40" ry="14" fill="#3B82F6" opacity="0.9"/>
            <path d="M-40,-30 L-40,5 Q0,18 40,5 L40,-30" fill="#3B82F6" opacity="0.6"/>
            <path d="M-40,5 L-40,40 Q0,53 40,40 L40,5" fill="#3B82F6" opacity="0.4"/>
            <circle cx="-20" cy="-30" r="4" fill="#FFF"/>
            <circle cx="-20" cy="5" r="4" fill="#FFF"/>
          </g>
        
          <circle cx="210" cy="95" r="35" fill="#3B82F6" opacity="0.7"/>
        

    <!-- Top Glow Rim Accent Line -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#3B82F6" stroke-width="2.5" opacity="0.8"/>
  </svg>