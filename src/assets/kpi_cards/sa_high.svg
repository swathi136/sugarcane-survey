<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <!-- Rich 2026 dark atmospheric background gradient -->
      <linearGradient id="bg_sa_high" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#420808"/>
        <stop offset="65%" stop-color="#751010"/>
        <stop offset="100%" stop-color="#050806"/>
      </linearGradient>

      <!-- Ambient radial lighting vignette -->
      <radialGradient id="glow_sa_high" cx="75%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#DC2626" stop-opacity="0.45"/>
        <stop offset="50%" stop-color="#DC2626" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#DC2626" stop-opacity="0.0"/>
      </radialGradient>

      <!-- Precision tech grid overlay -->
      <pattern id="grid_sa_high" width="16" height="16" patternUnits="userSpaceOnUse">
        <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#DC2626" stroke-width="0.5" opacity="0.09"/>
      </pattern>
    </defs>

    <!-- Base Canvas -->
    <rect width="300" height="200" fill="url(#bg_sa_high)"/>
    <rect width="300" height="200" fill="url(#grid_sa_high)"/>
    <rect width="300" height="200" fill="url(#glow_sa_high)"/>

    <!-- Tailored Vector Scene Artwork -->
    
          <g transform="translate(210, 95)">
            <path d="M0,-42 L42,-20 L42,20 Q0,55 0,55 Q0,55 -42,20 L-42,-20 Z" fill="#DC2626" stroke="#FFF" stroke-width="3"/>
            <line x1="0" y1="-18" x2="0" y2="12" stroke="#FFF" stroke-width="5" stroke-linecap="round"/>
            <circle cx="0" cy="26" r="4" fill="#FFF"/>
          </g>
        
          <circle cx="210" cy="95" r="35" fill="#DC2626" opacity="0.7"/>
        

    <!-- Top Glow Rim Accent Line -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#DC2626" stroke-width="2.5" opacity="0.8"/>
  </svg>