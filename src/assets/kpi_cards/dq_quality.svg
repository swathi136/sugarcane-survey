<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
    <defs>
      <!-- Rich 2026 dark atmospheric background gradient -->
      <linearGradient id="bg_dq_quality" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#032F1D"/>
        <stop offset="65%" stop-color="#0A5A39"/>
        <stop offset="100%" stop-color="#050806"/>
      </linearGradient>

      <!-- Ambient radial lighting vignette -->
      <radialGradient id="glow_dq_quality" cx="75%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#10B981" stop-opacity="0.45"/>
        <stop offset="50%" stop-color="#10B981" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#10B981" stop-opacity="0.0"/>
      </radialGradient>

      <!-- Precision tech grid overlay -->
      <pattern id="grid_dq_quality" width="16" height="16" patternUnits="userSpaceOnUse">
        <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#10B981" stroke-width="0.5" opacity="0.09"/>
      </pattern>
    </defs>

    <!-- Base Canvas -->
    <rect width="300" height="200" fill="url(#bg_dq_quality)"/>
    <rect width="300" height="200" fill="url(#grid_dq_quality)"/>
    <rect width="300" height="200" fill="url(#glow_dq_quality)"/>

    <!-- Tailored Vector Scene Artwork -->
    
          <circle cx="210" cy="95" r="35" fill="#10B981" opacity="0.7"/>
        
          <circle cx="210" cy="95" r="35" fill="#10B981" opacity="0.7"/>
        

    <!-- Top Glow Rim Accent Line -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#10B981" stroke-width="2.5" opacity="0.8"/>
  </svg>