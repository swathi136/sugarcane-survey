<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 400" width="600" height="400">
      <defs>
        <radialGradient id="glow_rep_latest" cx="72%" cy="42%" r="55%">
          <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.65"/>
          <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- 1. Field Calendar Date Photo Background -->
      <rect width="600" height="400" fill="#071E3A"/>
      <rect width="600" height="400" fill="black" opacity="0.40"/>
      <rect width="600" height="400" fill="url(#glow_rep_latest)"/>

      <!-- 2. Field Observation Calendar Symbol Overlaid -->
      <g transform="translate(420, 180)">
        <rect x="-60" y="-70" width="120" height="130" rx="14" fill="#3B82F6" stroke="#FFF" stroke-width="4"/>
        <rect x="-60" y="-70" width="120" height="35" rx="14" fill="#1D4ED8"/>
        <circle cx="-30" cy="-70" r="6" fill="#FFF"/>
        <circle cx="30" cy="-70" r="6" fill="#FFF"/>

        <text x="0" y="20" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" font-family="sans-serif">300</text>
        <text x="0" y="45" font-size="14" font-weight="900" fill="#93C5FD" text-anchor="middle" font-family="sans-serif">DAY</text>

        <rect x="-85" y="80" width="170" height="34" rx="8" fill="#1E40AF" stroke="#FFFFFF" stroke-width="2"/>
        <text x="0" y="103" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle" font-family="sans-serif" letter-spacing="1">LATEST DAY LOG</text>
      </g>

      <line x1="0" y1="0" x2="600" y2="0" stroke="#3B82F6" stroke-width="4"/>
    </svg>