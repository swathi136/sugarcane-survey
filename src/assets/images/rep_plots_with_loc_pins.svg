<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 400" width="600" height="400">
  <!-- 1. User Uploaded Aerial Farmland Photograph -->
  <rect width="600" height="400" fill="#1A331E"/>

  <!-- 2. Dark Scrim Overlay for Readability -->
  <rect width="600" height="400" fill="black" opacity="0.25"/>

  <!-- 3. Realistic 3D GPS Location Pins Pinned Directly onto the User's Farmland Photography -->

  <!-- Pin 1 (Green Paddy Field Plot - Top Left) -->
  <g transform="translate(180, 110)">
    <ellipse cx="0" cy="22" rx="14" ry="5" fill="black" opacity="0.5"/>
    <path d="M0,-32 Q15,-32 15,-12 Q15,12 0,22 Q-15,12 -15,-12 Q-15,-32 0,-32 Z" fill="#EF4444" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="0" cy="-12" r="6" fill="#FFFFFF"/>
    <rect x="-30" y="-55" width="60" height="20" rx="4" fill="rgba(15, 23, 42, 0.88)" stroke="#EF4444" stroke-width="2"/>
    <text x="0" y="-41" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" font-family="sans-serif">PLOT 1</text>
  </g>

  <!-- Pin 2 (Terraced Soil Plot - Bottom Center) -->
  <g transform="translate(380, 260)">
    <ellipse cx="0" cy="22" rx="14" ry="5" fill="black" opacity="0.5"/>
    <path d="M0,-32 Q15,-32 15,-12 Q15,12 0,22 Q-15,12 -15,-12 Q-15,-32 0,-32 Z" fill="#3B82F6" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="0" cy="-12" r="6" fill="#FFFFFF"/>
    <rect x="-30" y="-55" width="60" height="20" rx="4" fill="rgba(15, 23, 42, 0.88)" stroke="#3B82F6" stroke-width="2"/>
    <text x="0" y="-41" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" font-family="sans-serif">PLOT 2</text>
  </g>

  <!-- Pin 3 (River Canal Border Plot - Center Left) -->
  <g transform="translate(260, 190)">
    <ellipse cx="0" cy="22" rx="14" ry="5" fill="black" opacity="0.5"/>
    <path d="M0,-32 Q15,-32 15,-12 Q15,12 0,22 Q-15,12 -15,-12 Q-15,-32 0,-32 Z" fill="#F59E0B" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="0" cy="-12" r="6" fill="#FFFFFF"/>
    <rect x="-30" y="-55" width="60" height="20" rx="4" fill="rgba(15, 23, 42, 0.88)" stroke="#F59E0B" stroke-width="2"/>
    <text x="0" y="-41" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" font-family="sans-serif">PLOT 3</text>
  </g>

  <!-- Pin 4 (Terraced Soil Plot - Bottom Right) -->
  <g transform="translate(500, 290)">
    <ellipse cx="0" cy="18" rx="12" ry="4" fill="black" opacity="0.5"/>
    <path d="M0,-26 Q12,-26 12,-10 Q12,10 0,18 Q-12,10 -12,-10 Q-12,-26 0,-26 Z" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="0" cy="-10" r="5" fill="#FFFFFF"/>
  </g>

  <line x1="0" y1="0" x2="600" y2="0" stroke="#10B981" stroke-width="4"/>
</svg>