<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 400" width="600" height="400">
      <defs>
        <radialGradient id="glow_rep_plots" cx="72%" cy="42%" r="55%">
          <stop offset="0%" stop-color="#10B981" stop-opacity="0.65"/>
          <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- 1. Various Agricultural Field Plots Grid Photo -->
      <rect width="600" height="400" fill="#032F1D"/>
      <rect width="600" height="400" fill="black" opacity="0.40"/>
      <rect width="600" height="400" fill="url(#glow_rep_plots)"/>

      <!-- 2. Plot Focus Matrix Overlaid -->
      <g transform="translate(420, 180)">
        <!-- Grid Plot Matrix -->
        <rect x="-60" y="-60" width="50" height="50" rx="6" fill="#10B981" opacity="0.5" stroke="#FFF" stroke-width="2"/>
        <rect x="10" y="-60" width="50" height="50" rx="6" fill="#10B981" opacity="0.8" stroke="#FFF" stroke-width="3"/>
        <rect x="-60" y="10" width="50" height="50" rx="6" fill="#10B981" opacity="0.7" stroke="#FFF" stroke-width="2"/>
        <rect x="10" y="10" width="50" height="50" rx="6" fill="#10B981" opacity="0.4" stroke="#FFF" stroke-width="2"/>

        <!-- Camera Focus Reticle -->
        <circle r="40" fill="none" stroke="#FFF" stroke-width="3" stroke-dasharray="16 8"/>
        <circle r="6" fill="#FFF"/>

        <rect x="-80" y="80" width="160" height="34" rx="8" fill="#047857" stroke="#FFFFFF" stroke-width="2"/>
        <text x="0" y="103" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle" font-family="sans-serif" letter-spacing="1">FIELD PLOTS</text>
      </g>

      <line x1="0" y1="0" x2="600" y2="0" stroke="#10B981" stroke-width="4"/>
    </svg>